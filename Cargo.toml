[package]
name = "metagraph-db"
version = "0.1.0"
edition = "2024"

[dependencies]
parser = {path = "crates/parser"}

maplit = "1.0"
bincode = "2.0.1"
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["full"] }
axum = "0.8.8"
serde = {version = "1.0.218", features = ["derive"]}
parking_lot = "0.12.5"
zerocopy = { version = "0.8.48", features = ["derive"] }
dashmap = { version = "6.1.0" }
tower-http = { version = "0.6.8", features = ["fs"] }
log = "0.4.26"
simple_logger = "5.0.0"

[dev-dependencies]
tempfile = "3.6.0"
